version: "3.9"

services:
  db:
    image: postgres:16
    container_name: zhinan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhinan
      POSTGRES_PASSWORD: zhinan123
      POSTGRES_DB: zhinan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
